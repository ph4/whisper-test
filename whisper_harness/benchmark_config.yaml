# Whisper ASR Benchmark Configuration
# Usage: python benchmark.py --config this_file.yaml --audio test.wav
#
# Supports two formats:
# 1. Shortcut format (recommended) - just specify framework, model, and quantizations
# 2. Full explicit format - specify all parameters

benchmarks:
  # ===== FASTER-WHISPER SHORTCUT FORMAT =====
  # Just specify framework, model, and quantizations list
  # Devices default to [cuda], beam_sizes default to [1]
  
  - framework: faster-whisper
    model: small
    quantizations: [int8_float32, float16]
    
  - framework: faster-whisper
    model: medium
    quantizations: [int8_float32]
    devices: [cuda, cpu]  # Test on both GPU and CPU
    beam_sizes: [1, 3]    # Test different beam sizes


  # ===== WHISPER.CPP SHORTCUT FORMAT =====
  # For whisper.cpp, just specify model and quantizations
  
  - framework: whisper.cpp
    model: ggerganov/whisper.cpp
    quantizations: [q5_0, q4_0]
    devices: [cpu]
    threads: 2


  # ===== HUGGINGFACE WHISPER =====
  # For HF models, quantizations auto-detect based on model
  # You can optionally specify torch_dtype and load_in_8bit
  
  - framework: huggingface
    model: openai/whisper-small-ru
    devices: [cuda]
    # torch_dtype: float16  # Optional, defaults to quantization value
    # load_in_8bit: false   # Optional, enables 8-bit quantization


  # ===== FULL EXPLICIT FORMAT =====
  # When you need fine-grained control over all parameters
  
  - framework: faster-whisper
    model: large-v3
    quantizations: [int8_float32]
    devices: [cuda]
    beam_sizes: [1]
    compute_type: int8_float32  # Explicit compute type
    language: ru
    gpu_id: 0


  # ===== SBER GIGAAM =====
  - framework: sber_gigaam_ctc
    model: ctc
    use_onnx: true  # Use ONNX for memory efficiency


# ===== SYSTEM CONFIGURATION (Optional) =====
# These override auto-detected system info if needed
system:
  # gpu_count: 1
  # total_vram_gb: 2.0
  # total_ram_gb: 8.0


# ===== BENCHMARK MODE =====
# quick: Test only small/medium models with minimal configurations
# full: Test all configurations including large models
# compare: Compare frameworks only with standard settings
mode: quick


# ===== OUTPUT OPTIONS =====
output:
  csv: true
  json: true
  markdown: true
