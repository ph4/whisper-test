[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-harness"
version = "1.0.0"
description = "Modular benchmarking harness for Whisper ASR models on resource-constrained systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ph4"}
]
keywords = ["whisper", "asr", "benchmark", "transcription", "performance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "faster-whisper>=1.0.0",
    "transformers>=4.30.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "psutil>=5.9.0",
    "pynvml>=11.0.0",
    "pyyaml>=6.0",
    "jiwer>=3.0.0",
    "huggingface_hub>=0.17.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]
whisper-cpp = [
    "pywhispercpp>=1.5.0",
]
onnx = [
    "onnxruntime-gpu>=1.16.0",
]
onnx-cpu = [
    "onnxruntime>=1.16.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]
all = [
    "torch>=2.0.0",
    "pywhispercpp>=1.5.0",
    "onnxruntime-gpu>=1.16.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
whisper-bench = "whisper_harness.benchmark:main"
whisper-cli = "whisper_harness.cli:main"

[project.urls]
Homepage = "https://github.com/ph4/whisper-test"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
